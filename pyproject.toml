[project]
name = "tx-hackathon-scaffold"
version = "0.1.0"
description = "Eclipse Tractus-X Data Space Management Service, hackathon scaffold: shared building blocks, process orchestration, stand-ins and test doubles"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "pg8000>=1.31.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.uv]
package = false

# Quality gate (tools/quality/gate.py, docs/architecture/decisions/ADR-0003-inside-a-module.md).
# Existing findings are frozen per area in tools/quality/baseline.json; a pull request may not add new ones.
[tool.ruff]
line-length = 120
target-version = "py312"
# ebw/ is a separate project (own requirements.txt and `tools` package), not part of this application.
extend-exclude = ["spec", "ebw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "SIM", "ANN401"]
# ANN401: no `Any` in a function signature (ADR-0003 "Types"): precise types inside a module, `object` only
# where unknown input is checked.
# B008: FastAPI declares parameters with function calls in defaults (Body(...), Depends(...), Query(...)).
ignore = ["B008"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["modules", "portal_common", "scaffold", "tools", "controllers", "iam", "ebw", "conftest"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported from other test files and used as parameters (F401, F811);
# a test reads top to bottom, so its complexity is not limited (C901).
"tests/**" = ["F401", "F811", "C901"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^spec/", "^ebw/", "^\\.venv/"]
