# The quality gate before every commit, for people and coding agents alike (ADR-0003).
# Install once per clone:  uvx pre-commit install
# CI runs the same gate (.github/workflows/quality.yml); `git commit --no-verify` does not get past it.
repos:
  - repo: local
    hooks:
      - id: quality-gate
        name: quality gate (tools/quality/gate.py)
        entry: uv run python tools/quality/gate.py
        language: system
        # every file: the gate picks the areas it checks (Python code and the agent files)
        pass_filenames: true
        require_serial: true
