openapi: 3.1.0
info:
  title: C2-M2 Users and App Access - Private API
  version: 0.2.0
  description: Private API for module queries and Process Orchestration steps. HTTP
    calls require query_c2_m2 or execute_steps_c2_m2. In-process calls use modules.c2_m2.interface
    without a token. Event schemas describe the private CloudEvents contract.
servers:
- url: /api/c2-m2
security:
- portalIam: []
tags:
- name: Queries
  description: For other modules
- name: Steps
  description: For Process Orchestration
paths:
  /internal/app-roles:
    get:
      tags:
      - Queries
      operationId: listAppRoles
      summary: App roles of one or more apps, from their templates
      description: README 9.1. The order of the apps follows the request.
      x-permission: query_c2_m2
      x-permission-scope: osp
      parameters:
      - name: appId
        in: query
        required: true
        description: May be given 1 to QUERY_MAX_APPS (default 50) times.
        schema:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Roles per app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppRoles'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /internal/app-instance-clients:
    get:
      tags:
      - Queries
      operationId: listAppInstanceClients
      summary: Instance clients by app, subscription or customer
      description: 'README 9.2. At least one of appId and offerSubscriptionId is required.

        Without the filter status: PENDING and ACTIVE. Reads only the module''s

        own table.

        '
      x-permission: query_c2_m2
      x-permission-scope: osp
      parameters:
      - name: appId
        in: query
        schema:
          type: string
          format: uuid
      - name: offerSubscriptionId
        in: query
        schema:
          type: string
          format: uuid
      - name: customerCompanyId
        in: query
        schema:
          type: string
          format: uuid
      - name: instanceKind
        in: query
        schema:
          $ref: '#/components/schemas/InstanceKind'
      - name: status
        in: query
        description: May be given several times.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/InstanceClientStatus'
        style: form
        explode: true
      responses:
        '200':
          description: Matching instance clients, sorted by createdAt
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppInstanceClient'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /internal/app-instance-clients/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Queries
      operationId: getAppInstanceClient
      summary: One instance client
      description: README 9.3.
      x-permission: query_c2_m2
      x-permission-scope: osp
      responses:
        '200':
          description: The instance client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInstanceClient'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /internal/company-users:
    get:
      tags:
      - Queries
      operationId: listCompanyUserRefs
      summary: People of a company, optionally with a portal role
      description: 'README 9.4. E.g. for notifications. Without the filter status:
        ACTIVE.

        Without names.

        '
      x-permission: query_c2_m2
      x-permission-scope: osp
      parameters:
      - name: companyId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: portalRole
        in: query
        description: A company portal role, e.g. `Company Admin`.
        schema:
          $ref: '#/components/schemas/PortalRoleName'
      - name: status
        in: query
        description: May be given several times.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BindingStatus'
        style: form
        explode: true
      responses:
        '200':
          description: Matching people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyUserRef'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/create-client-template:
    post:
      tags:
      - Steps
      operationId: stepCreateClientTemplate
      summary: 'Step: create the client template of an approved app'
      description: 'README 8.1. Preconditions: none in the module. Repeatable; the
        template

        is found again by the app ID.

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepCreateClientTemplate'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultTemplate'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/create-instance-client:
    post:
      tags:
      - Steps
      operationId: stepCreateInstanceClient
      summary: 'Step: create an instance client from the template, disabled'
      description: 'README 8.2. Precondition: template of the app created. SINGLE
        for a

        single-instance app (at the approval), SUBSCRIPTION for a subscription

        to a multi-instance app. Repeatable; the row is found again by

        offerSubscriptionId or, for SINGLE, by appId.

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepCreateInstanceClient'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultInstanceClient'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/enable-instance-client:
    post:
      tags:
      - Steps
      operationId: stepEnableInstanceClient
      summary: 'Step: enable an instance client'
      description: 'README 8.3. Precondition: instance client created, status PENDING
        or

        ACTIVE. PENDING becomes ACTIVE; ACTIVE stays; DISABLED gives 409.

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepInstanceClientRef'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultInstanceClient'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/disable-instance-client:
    post:
      tags:
      - Steps
      operationId: stepDisableInstanceClient
      summary: 'Step: disable an instance client'
      description: 'README 8.4. Precondition: row of the instance client exists. PENDING
        or

        ACTIVE becomes DISABLED (final); DISABLED stays.

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepInstanceClientRef'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultInstanceClient'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/update-instance-url:
    post:
      tags:
      - Steps
      operationId: stepUpdateInstanceUrl
      summary: 'Step: change the URL of an instance'
      description: 'README 8.5. Precondition: instance client created, not DISABLED.
        Sets

        baseUrl and the redirect URI of the client.

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpdateInstanceUrl'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultInstanceClient'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/add-app-roles:
    post:
      tags:
      - Steps
      operationId: stepAddAppRoles
      summary: 'Step: add app roles to the template and to all instance clients'
      description: 'README 8.6. Precondition: template of the app created. Existing
        roles

        are skipped and keep their descriptions.

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepAddAppRoles'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultAddAppRoles'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/update-role-descriptions:
    post:
      tags:
      - Steps
      operationId: stepUpdateRoleDescriptions
      summary: 'Step: replace the descriptions of app roles'
      description: 'README 8.7. Precondition: template created, every named role exists.

        Per role the complete new list of descriptions; on the template and on

        all instance clients. An unknown role gives 404, and then nothing is

        changed.

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpdateRoleDescriptions'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultUpdateRoleDescriptions'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/assign-company-admin:
    post:
      tags:
      - Steps
      operationId: stepAssignCompanyAdmin
      summary: 'Step: bind the account of the applicant and make it Company Admin'
      description: 'README 8.8. Preconditions: application approved, BPN assigned,
        account

        of the applicant in the Portal IAM. Repeatable by companyId and

        applicantSub. An account that is bound to another company gives 409

        user-already-bound (retryable false).

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepAssignCompanyAdmin'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultAssignCompanyAdmin'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/disable-company-users:
    post:
      tags:
      - Steps
      operationId: stepDisableCompanyUsers
      summary: 'Step: remove company and roles from the accounts of a deactivated
        company'
      description: 'README 8.9. Precondition: company deactivated (CompanyDeactivated).

        Accounts stay enabled but lose the company, the company portal roles and

        the app roles (saved in suspended_roles); sessions ended; open

        invitations revoked. Not for the OSP company. Repeatable; the event

        CompanyUsersDisabled exactly once.

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepCompanyRef'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultCompanyUsers'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /steps/enable-company-users:
    post:
      tags:
      - Steps
      operationId: stepEnableCompanyUsers
      summary: 'Step: give company and roles back to the accounts of a reactivated
        company'
      description: 'README 8.10. Precondition: company reactivated (CompanyReactivated).

        Accounts with binding DISABLED get the company and the saved roles back.

        Repeatable; the event CompanyUsersEnabled exactly once.

        '
      x-permission: execute_steps_c2_m2
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepCompanyRef'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResultCompanyUsers'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Lang:
      name: lang
      in: query
      description: Language of `description`; otherwise English, otherwise the first
        one.
      schema:
        type: string
        pattern: ^[a-z]{2}$
        default: en
        examples:
        - de
        - en
  schemas:
    InstanceKind:
      type: string
      description: SINGLE = the one instance of a single-instance app; SUBSCRIPTION
        = the instance of a subscription to a multi-instance app.
      enum:
      - SINGLE
      - SUBSCRIPTION
    InstanceClientStatus:
      type: string
      description: PENDING = created, client disabled; ACTIVE = client enabled; DISABLED
        = client disabled, final.
      enum:
      - PENDING
      - ACTIVE
      - DISABLED
    BindingStatus:
      type: string
      description: 'ACTIVE = bound; DISABLED = company deactivated, account without
        company

        and roles (saved); REMOVED = binding removed, final for this row.

        '
      enum:
      - ACTIVE
      - DISABLED
      - REMOVED
    JoinedVia:
      type: string
      description: ONBOARDING = step assign-company-admin; INVITATION = invitation
        accepted.
      enum:
      - ONBOARDING
      - INVITATION
    RemovalReason:
      type: string
      description: 'REMOVED_BY_COMPANY = removed by the Company Admin; REMOVED_BY_OSP
        = removed

        by the OSP staff; ACCOUNT_DELETED = account missing in the Portal IAM.

        '
      enum:
      - REMOVED_BY_COMPANY
      - REMOVED_BY_OSP
      - ACCOUNT_DELETED
    InstanceUrl:
      type: string
      format: uri
      maxLength: 255
      pattern: ^https?://[^#]+$
      description: Absolute http or https URL without '#'.
      examples:
      - https://demo-app.example.org
    RoleName:
      type: string
      minLength: 1
      maxLength: 255
      description: Name of an app role.
      examples:
      - Viewer
    PortalRoleName:
      type: string
      minLength: 1
      maxLength: 255
      description: 'Name of a portal role on the client portal-core. In the company
        from

        COMPANY_PORTAL_ROLES, for the staff from STAFF_PORTAL_ROLES.

        '
      examples:
      - Company Admin
      - IT Admin
      - Member
      - OSP Reviewer
      - OSP Admin
    BpnL:
      type: string
      pattern: ^BPNL[0-9A-Z]{12}$
      examples:
      - BPNLIUK2REMLK3F4
    RoleDescription:
      type: object
      required:
      - lang
      - text
      properties:
        lang:
          type: string
          pattern: ^[a-z]{2}$
          description: Language from the configuration LANGUAGES, e.g. de or en.
        text:
          type: string
          minLength: 1
          maxLength: 255
    RoleInput:
      type: object
      required:
      - name
      - descriptions
      properties:
        name:
          $ref: '#/components/schemas/RoleName'
        descriptions:
          type: array
          minItems: 1
          description: At most one per language.
          items:
            $ref: '#/components/schemas/RoleDescription'
    AppRole:
      type: object
      required:
      - name
      - descriptions
      properties:
        name:
          $ref: '#/components/schemas/RoleName'
        description:
          type:
          - string
          - 'null'
          description: In the requested language, otherwise English, otherwise the
            first one.
        descriptions:
          type: array
          items:
            $ref: '#/components/schemas/RoleDescription'
    AppRoles:
      type: object
      required:
      - appId
      - templateExists
      - roles
      properties:
        appId:
          type: string
          format: uuid
        templateExists:
          type: boolean
        roles:
          type: array
          description: Sorted by name. Empty if templateExists is false.
          items:
            $ref: '#/components/schemas/AppRole'
    AppInstanceClient:
      type: object
      required:
      - id
      - appId
      - instanceKind
      - iamClientId
      - instanceUrl
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        instanceKind:
          $ref: '#/components/schemas/InstanceKind'
        offerSubscriptionId:
          type:
          - string
          - 'null'
          format: uuid
        customerCompanyId:
          type:
          - string
          - 'null'
          format: uuid
        iamClientId:
          type: string
          description: Client ID in the Portal IAM, e.g. app123.
        instanceUrl:
          $ref: '#/components/schemas/InstanceUrl'
        status:
          $ref: '#/components/schemas/InstanceClientStatus'
        createdAt:
          type: string
          format: date-time
        changedAt:
          type: string
          format: date-time
    CompanyUserRef:
      type: object
      required:
      - userId
      - status
      description: Without names.
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BindingStatus'
    StepRequest:
      type: object
      required:
      - processId
      - stepRunId
      properties:
        processId:
          type: string
          format: uuid
          description: Flow in Process Orchestration; only for the audit log.
        stepRunId:
          type: string
          format: uuid
          description: This run of the step; only for the audit log.
    StepCreateClientTemplate:
      allOf:
      - $ref: '#/components/schemas/StepRequest'
      - type: object
        required:
        - appId
        - providerCompanyId
        - appName
        - roles
        properties:
          appId:
            type: string
            format: uuid
          providerCompanyId:
            type: string
            format: uuid
          appName:
            type: string
            minLength: 1
            maxLength: 255
          roles:
            type: array
            minItems: 1
            description: App roles from the approved draft; names unique.
            items:
              $ref: '#/components/schemas/RoleInput'
    StepCreateInstanceClient:
      allOf:
      - $ref: '#/components/schemas/StepRequest'
      - type: object
        required:
        - appId
        - instanceKind
        - instanceUrl
        properties:
          appId:
            type: string
            format: uuid
          instanceKind:
            $ref: '#/components/schemas/InstanceKind'
          instanceUrl:
            $ref: '#/components/schemas/InstanceUrl'
          offerSubscriptionId:
            type: string
            format: uuid
            description: Required for SUBSCRIPTION, not allowed for SINGLE.
          customerCompanyId:
            type: string
            format: uuid
            description: Required for SUBSCRIPTION, not allowed for SINGLE.
    StepInstanceClientRef:
      allOf:
      - $ref: '#/components/schemas/StepRequest'
      - type: object
        required:
        - appInstanceClientId
        properties:
          appInstanceClientId:
            type: string
            format: uuid
    StepUpdateInstanceUrl:
      allOf:
      - $ref: '#/components/schemas/StepInstanceClientRef'
      - type: object
        required:
        - instanceUrl
        properties:
          instanceUrl:
            $ref: '#/components/schemas/InstanceUrl'
    StepAddAppRoles:
      allOf:
      - $ref: '#/components/schemas/StepRequest'
      - type: object
        required:
        - appId
        - roles
        properties:
          appId:
            type: string
            format: uuid
          roles:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/RoleInput'
    StepUpdateRoleDescriptions:
      allOf:
      - $ref: '#/components/schemas/StepRequest'
      - type: object
        required:
        - appId
        - roles
        properties:
          appId:
            type: string
            format: uuid
          roles:
            type: array
            minItems: 1
            description: Per role the complete new list of descriptions.
            items:
              $ref: '#/components/schemas/RoleInput'
    StepAssignCompanyAdmin:
      allOf:
      - $ref: '#/components/schemas/StepRequest'
      - type: object
        required:
        - companyId
        - bpn
        - applicantSub
        properties:
          companyId:
            type: string
            format: uuid
          bpn:
            $ref: '#/components/schemas/BpnL'
          applicantSub:
            type: string
            format: uuid
            description: sub of the applicant in the Portal IAM, from the application
              (C1-M2).
    StepCompanyRef:
      allOf:
      - $ref: '#/components/schemas/StepRequest'
      - type: object
        required:
        - companyId
        properties:
          companyId:
            type: string
            format: uuid
    StepResult:
      type: object
      required:
      - stepRunId
      - state
      properties:
        stepRunId:
          type: string
          format: uuid
        state:
          type: string
          description: Common contract of the steps (FRAMEWORK 4.4). All steps of
            this module answer with DONE.
          enum:
          - DONE
          - RUNNING
    StepResultTemplate:
      allOf:
      - $ref: '#/components/schemas/StepResult'
      - type: object
        required:
        - result
        properties:
          result:
            type: object
            required:
            - appId
            - iamClientId
            - roleNames
            properties:
              appId:
                type: string
                format: uuid
              iamClientId:
                type: string
