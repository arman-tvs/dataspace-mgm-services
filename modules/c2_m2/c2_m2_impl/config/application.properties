# Default configuration of C2-M2 (README section 4). Keys are the README variable names in .properties form
# (DATABASE_URL -> database.url); the placeholders use the README names as environment variables.
# C2_M2_CONFIG_FILE points to another file of the same form; without it this file is used.
# ${NAME:default} takes the environment variable NAME, or the default when it is unset or empty.
# Never write a real secret into this file (FRAMEWORK 4.6): keep secrets as placeholders.

database.url=${DATABASE_URL:}
iam.url=${IAM_URL:}
# empty = the realm of the shared token library
iam.realm=${IAM_REALM:}

c2-m2.client.id=${C2_M2_CLIENT_ID:svc-c2-m2}
# empty = the shared secret of the test service accounts (C2-M5 14.1)
c2-m2.client.secret=${C2_M2_CLIENT_SECRET:${SERVICE_CLIENT_SECRET:}}
portal.core.client.id=${PORTAL_CORE_CLIENT_ID:portal-core}

company.portal.roles=${COMPANY_PORTAL_ROLES:Company Admin,IT Admin,Member}
company.admin.role=${COMPANY_ADMIN_ROLE:Company Admin}
staff.portal.roles=${STAFF_PORTAL_ROLES:OSP Reviewer,OSP Admin}
staff.admin.role=${STAFF_ADMIN_ROLE:OSP Admin}
company.id.attribute=${COMPANY_ID_ATTRIBUTE:company_id}
bpn.attribute=${BPN_ATTRIBUTE:bpn}

invitation.ttl.hours=${INVITATION_TTL_HOURS:168}
invitation.max.open=${INVITATION_MAX_OPEN:50}
invitation.max.failed.attempts=${INVITATION_MAX_FAILED_ATTEMPTS:5}
invitation.name.check=${INVITATION_NAME_CHECK:true}
bootstrap.admin.file=${BOOTSTRAP_ADMIN_FILE:}

instance.client.id.prefix=${INSTANCE_CLIENT_ID_PREFIX:app}
template.client.id.prefix=${TEMPLATE_CLIENT_ID_PREFIX:app-template-}
instance.client.default.scopes=${INSTANCE_CLIENT_DEFAULT_SCOPES:basic,acr,roles,web-origins,catena}
instance.client.optional.scopes=${INSTANCE_CLIENT_OPTIONAL_SCOPES:}
languages=${LANGUAGES:de,en}
query.max.apps=${QUERY_MAX_APPS:50}
