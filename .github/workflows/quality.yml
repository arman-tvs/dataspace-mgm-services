# The definition of done of AGENTS.md as checks, the same for every author, person or coding agent:
# the quality gate (tools/quality/gate.py, ADR-0003), the tests and demo.py. Make the three jobs
# required status checks of `develop` and `main`.
name: "Quality"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # The spec is the contract (AGENTS.md "How to run"); portal_common, the tests and module-map read it.
  SPEC_REPOSITORY: https://github.com/tx-arena-events/portal-backend-spec.git

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Fetch the spec
        run: git clone --depth 1 "$SPEC_REPOSITORY" spec
      - name: Install
        run: uv sync --frozen
      - name: Quality gate (no new findings against tools/quality/baseline.json)
        run: uv run python tools/quality/gate.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Fetch the spec
        run: git clone --depth 1 "$SPEC_REPOSITORY" spec
      - name: Install
        run: uv sync --frozen
      - name: pytest
        run: uv run pytest -q

  demo:
    name: Demo (flows across all modules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Fetch the spec
        run: git clone --depth 1 "$SPEC_REPOSITORY" spec
      - name: Install
        run: uv sync --frozen
      - name: demo.py with the in-memory IAM (no Docker)
        run: uv run python demo.py --small-iam
